version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # RUSTSEC-2024-0429 : unsoundness de glib::VariantStrIter, corrigée en
      # 0.20. Inatteignable ici — glib arrive via gtk 0.18 (liaisons GTK3) dont
      # dépend Tauri sur Linux, et qui plafonne glib à ^0.18. Sans cette
      # exclusion, Dependabot échoue à chaque exécution. Voir SECURITY.md.
      - dependency-name: glib

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
