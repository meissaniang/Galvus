name: release

# Déclenché en poussant un tag de version (ex. v1.0.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Crée la release en brouillon avec les notes extraites du CHANGELOG.
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Extraire les notes de version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Section du CHANGELOG comprise entre "## [version]" et le titre suivant.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Voir le [CHANGELOG](https://github.com/meissaniang/Galvus/blob/main/CHANGELOG.md)." > notes.md
          fi
          cat >> notes.md <<'EOF'

          ---

          ## Téléchargements

          | Plateforme | Fichier |
          | --- | --- |
          | macOS (Apple Silicon) | `Galvus_*_aarch64-macos.dmg` |
          | macOS (Intel) | `Galvus_*_x64-macos.dmg` |
          | Windows | `Galvus_*_x64-setup-windows.exe` ou `Galvus_*_x64_en-US-windows.msi` |
          | Linux | `Galvus_*_amd64-linux.AppImage`, `-linux.deb` ou `-linux.rpm` |

          Les binaires ne sont pas signés : macOS demande un clic droit → **Ouvrir**
          au premier lancement, Windows affiche un avertissement SmartScreen.

          **Prérequis** : un client OpenSSH sur la machine (présent par défaut sur
          macOS, Linux, Windows 10 1809+ et Windows 11).
          EOF

      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("notes.md", "utf8");
            const tag = process.env.GITHUB_REF_NAME;
            const { owner, repo } = context.repo;

            // Réutilise la release si le tag a déjà été poussé (relance après
            // un échec de build), au lieu d'échouer sur un doublon.
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: data.id,
                name: `Galvus ${tag}`,
                body,
                draft: true,
              });
              core.info(`Release existante réutilisée (#${data.id})`);
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Galvus ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  # 2. Compile et téléverse les installeurs de chaque plateforme.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            suffix: macos
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            suffix: macos
          - platform: ubuntu-22.04
            target: ""
            args: ""
            suffix: linux
          - platform: windows-latest
            target: ""
            args: ""
            suffix: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm est lue depuis le champ packageManager du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Dépendances de compilation (Windows)
        if: matrix.platform == 'windows-latest'
        # OpenSSL (vendored par SQLCipher) se compile avec NASM et Perl.
        run: choco install nasm strawberryperl -y --no-progress

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile

      # Note : ne déclarez APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID et TAURI_SIGNING_PRIVATE_KEY
      # qu'une fois les secrets réellement renseignés. Une variable définie mais
      # vide suffit à déclencher la signature côté Tauri, qui échoue alors sur
      # « failed to import keychain certificate ».
      # Compile sans téléverser : les fichiers sont d'abord renommés ci-dessous.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Tauri ne permet pas de personnaliser le nom des bundles : on suffixe donc
      # chaque fichier par son système avant de l'attacher à la release.
      - name: Renommer et téléverser les installeurs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: ${{ matrix.suffix }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          mkdir -p upload

          # artifactPaths est un tableau JSON ; Node est déjà installé sur le runner.
          node -e 'JSON.parse(process.env.PATHS).forEach((p) => console.log(p))' \
            > paths.txt
          while IFS= read -r path; do
            # Sur Windows les chemins arrivent avec des antislashs : on les
            # normalise, sinon le nom de base ne peut pas être isolé.
            path="${path//\\//}"
            # Les bundles .app sont des dossiers : seuls les fichiers sont publiés.
            [ -f "$path" ] || continue
            base="${path##*/}"
            case "$base" in
              *.tar.gz) name="${base%.tar.gz}"; ext="tar.gz" ;;
              *)        name="${base%.*}";      ext="${base##*.}" ;;
            esac
            cp "$path" "upload/${name}-${SUFFIX}.${ext}"
          done < paths.txt

          ls -1 upload
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber

  # 3. Publie la release une fois tous les assets téléversés.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: "true",
            });
