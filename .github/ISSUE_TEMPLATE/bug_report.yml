name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour ce signalement. Pour une **vulnérabilité de sécurité**, n'utilisez
        pas ce formulaire mais l'onglet Security du dépôt.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il, et à quoi vous attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir l'écran Serveurs
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Galvus
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux
      description: Extrait pertinent des logs de l'application, si disponible.
      render: shell
