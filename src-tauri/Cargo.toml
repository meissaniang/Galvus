[package]
name = "galvus"
version = "0.2.0"
description = "Galvus — client SSH desktop moderne, open source"
authors = ["Meissa Niang"]
license = "MIT"
repository = "https://github.com/meissaniang/Galvus"
homepage = "https://github.com/meissaniang/Galvus"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "galvus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.4.3"
tauri-plugin-log = "2.9.0"
log = "0.4.33"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.2"
base64 = "0.23.0"

# Coffre natif : un backend par plateforme (Keychain / Credential Manager /
# Secret Service). L'API `keyring` reste identique côté code.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

